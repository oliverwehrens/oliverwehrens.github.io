<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tetris</title>
<style>
  :root{
    --bg:#0b0d17;
    --panel:#141829;
    --line:#242a45;
    --text:#e8ecf8;
    --muted:#8b93b4;
    --accent:#67e8f9;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:radial-gradient(1200px 800px at 50% -10%, #1b2140 0%, var(--bg) 60%);
    color:var(--text);
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    display:flex;align-items:center;justify-content:center;
    padding:16px;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{display:flex;gap:18px;align-items:flex-start;}
  .board-box{display:flex;flex-direction:column;}
  .canvas-wrap{position:relative;display:flex;}
  canvas{
    display:block;
    background:#080a12;
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
    touch-action:none;
  }
  .side{display:flex;flex-direction:column;gap:12px;min-width:150px;}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;
  }
  .card h2{
    margin:0 0 8px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);font-weight:600;
  }
  .stat{display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-size:13px;margin:4px 0;}
  .stat span:last-child{font-variant-numeric:tabular-nums;font-size:16px;}
  .keys{font-size:11px;line-height:1.75;color:var(--muted);}
  .keys b{color:var(--text);font-weight:600;}
  #overlay{
    position:absolute;inset:0;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:rgba(8,10,18,.86);backdrop-filter:blur(3px);border-radius:10px;text-align:center;padding:20px;
  }
  #overlay.show{display:flex;}
  #overlay h1{margin:0;font-size:26px;letter-spacing:.06em;}
  #overlay p{margin:0;color:var(--muted);font-size:12px;line-height:1.6;}
  button{
    font-family:inherit;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    background:var(--accent);color:#06121a;border:0;border-radius:6px;
    padding:10px 20px;cursor:pointer;font-weight:700;margin-top:6px;
  }
  button:active{transform:translateY(1px);}
  .touch{display:none;gap:8px;margin-top:12px;}
  .touch button{flex:1;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:14px 0;font-size:16px;}
  @media (max-width:720px){
    body{padding:8px;align-items:flex-start;}
    .wrap{flex-direction:column;align-items:center;gap:8px;width:100%;}
    .side{flex-direction:row;justify-content:center;align-items:flex-start;min-width:0;width:100%;gap:8px;}
    .card{padding:6px 8px;}
    .card h2{margin:0 0 4px;font-size:9px;}
    .stat{font-size:11px;margin:1px 0;}
    .stat span:last-child{font-size:13px;}
    .keys{display:none;}
    .touch{display:flex;margin-top:8px;}
    .touch button{padding:12px 0;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="board-box">
    <div class="canvas-wrap">
    <canvas id="board" width="300" height="600"></canvas>
    <div id="overlay">
      <h1 id="ov-title">TETRIS</h1>
      <p id="ov-text">Stack the blocks. Clear the lines.</p>
      <button id="ov-btn">Play</button>
    </div>
    </div>
    <div class="touch">
      <button data-act="left">◀</button>
      <button data-act="rotate">⟳</button>
      <button data-act="right">▶</button>
      <button data-act="down">▼</button>
      <button data-act="drop">⤓</button>
    </div>
  </div>

  <div class="side">
    <div class="card">
      <h2>Next</h2>
      <canvas id="next" width="126" height="290"></canvas>
    </div>
    <div class="card">
      <h2>Hold</h2>
      <canvas id="hold" width="126" height="70"></canvas>
    </div>
    <div class="card">
      <h2>Stats</h2>
      <div class="stat"><span>Score</span><span id="score">0</span></div>
      <div class="stat"><span>Lines</span><span id="lines">0</span></div>
      <div class="stat"><span>Level</span><span id="level">1</span></div>
      <div class="stat"><span>Best</span><span id="best">0</span></div>
    </div>
    <div class="card keys">
      <h2>Controls</h2>
      <b>← →</b> move<br>
      <b>↓</b> soft drop<br>
      <b>Space</b> hard drop<br>
      <b>↑ / X</b> rotate CW<br>
      <b>Z / Ctrl</b> rotate CCW<br>
      <b>C / Shift</b> hold<br>
      <b>P</b> pause &nbsp; <b>R</b> restart
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

// HIDDEN = 0 so a freshly spawned piece is visible immediately
const COLS = 10, ROWS = 20, HIDDEN = 0, CELL = 30;
const board = document.getElementById('board');
const ctx = board.getContext('2d');
const nextCv = document.getElementById('next'), nextCtx = nextCv.getContext('2d');
const holdCv = document.getElementById('hold'), holdCtx = holdCv.getContext('2d');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ov-title');
const ovText = document.getElementById('ov-text');
const ovBtn = document.getElementById('ov-btn');
const el = {
  score: document.getElementById('score'),
  lines: document.getElementById('lines'),
  level: document.getElementById('level'),
  best:  document.getElementById('best')
};

// ---- pieces: rotation states as [x,y] offsets, SRS-compatible ----
const SHAPES = {
  I:{color:'#3ddbd9', cells:[[0,1],[1,1],[2,1],[3,1]], size:4},
  J:{color:'#5b8cff', cells:[[0,0],[0,1],[1,1],[2,1]], size:3},
  L:{color:'#ffa14a', cells:[[2,0],[0,1],[1,1],[2,1]], size:3},
  O:{color:'#ffd85e', cells:[[1,0],[2,0],[1,1],[2,1]], size:4},
  S:{color:'#5ee07f', cells:[[1,0],[2,0],[0,1],[1,1]], size:3},
  T:{color:'#c07bff', cells:[[1,0],[0,1],[1,1],[2,1]], size:3},
  Z:{color:'#ff6b81', cells:[[0,0],[1,0],[1,1],[2,1]], size:3}
};
const TYPES = Object.keys(SHAPES);

// rotate cell coords inside the piece's bounding box
function rotateCells(cells, size, rot){
  let out = cells.map(c => [c[0], c[1]]);
  for (let r = 0; r < rot; r++){
    out = out.map(([x,y]) => [size - 1 - y, x]);
  }
  return out;
}

// SRS wall kick tables
const KICKS_JLSTZ = {
  '0>1':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
  '1>0':[[0,0],[1,0],[1,-1],[0,2],[1,2]],
  '1>2':[[0,0],[1,0],[1,-1],[0,2],[1,2]],
  '2>1':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
  '2>3':[[0,0],[1,0],[1,1],[0,-2],[1,-2]],
  '3>2':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
  '3>0':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
  '0>3':[[0,0],[1,0],[1,1],[0,-2],[1,-2]]
};
const KICKS_I = {
  '0>1':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],
  '1>0':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],
  '1>2':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]],
  '2>1':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],
  '2>3':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],
  '3>2':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],
  '3>0':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],
  '0>3':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]]
};

let grid, piece, queue, bag, hold, holdUsed;
let score, lines, level, best, state; // state: 'menu' | 'playing' | 'paused' | 'over'
let dropTimer, lastTime, lockTimer, lockResets, flashRows, flashTimer, overAt = 0;

best = 0;
try { const b = window.__tetrisBest; if (typeof b === 'number') best = b; } catch(e){}
el.best.textContent = best;

function emptyGrid(){
  const g = [];
  for (let y = 0; y < ROWS + HIDDEN; y++) g.push(new Array(COLS).fill(null));
  return g;
}

function refillBag(){
  const b = TYPES.slice();
  for (let i = b.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  bag = b;
}

function nextType(){
  if (!bag || !bag.length) refillBag();
  return bag.pop();
}

function spawn(type){
  const s = SHAPES[type];
  return { type, rot:0, x: Math.floor((COLS - s.size) / 2), y: 0, color: s.color };
}

function cellsOf(p){
  const s = SHAPES[p.type];
  return rotateCells(s.cells, s.size, p.rot).map(([x,y]) => [p.x + x, p.y + y]);
}

function collides(p){
  for (const [x,y] of cellsOf(p)){
    if (x < 0 || x >= COLS || y >= ROWS + HIDDEN) return true;
    if (y >= 0 && grid[y][x]) return true;
  }
  return false;
}

function newPiece(type){
  piece = spawn(type !== undefined ? type : queue.shift());
  if (type === undefined) queue.push(nextType());
  holdUsed = false;
  lockTimer = null; lockResets = 0;
  if (collides(piece)) gameOver();
}

// ---- movement ----
function move(dx, dy){
  const t = Object.assign({}, piece);
  t.x += dx; t.y += dy;
  if (collides(t)) return false;
  piece = t;
  if (lockTimer !== null && lockResets < 15){ lockTimer = 0; lockResets++; }
  return true;
}

function rotate(dir){
  if (piece.type === 'O') return;
  const from = piece.rot, to = (piece.rot + dir + 4) % 4;
  const table = piece.type === 'I' ? KICKS_I : KICKS_JLSTZ;
  const kicks = table[from + '>' + to] || [[0,0]];
  for (const [kx,ky] of kicks){
    const t = Object.assign({}, piece, { rot: to, x: piece.x + kx, y: piece.y - ky });
    if (!collides(t)){
      piece = t;
      if (lockTimer !== null && lockResets < 15){ lockTimer = 0; lockResets++; }
      return;
    }
  }
}

function ghostY(){
  let g = piece.y;
  while (true){
    const t = Object.assign({}, piece, { y: g + 1 });
    if (collides(t)) break;
    g++;
  }
  return g;
}

function hardDrop(){
  const start = piece.y;
  piece.y = ghostY();
  score += (piece.y - start) * 2;
  lockPiece();
}

function doHold(){
  if (holdUsed) return;
  const cur = piece.type;
  if (hold === null){
    hold = cur;
    newPiece();
  } else {
    const swap = hold;
    hold = cur;
    newPiece(swap);
  }
  holdUsed = true;
}

function lockPiece(){
  for (const [x,y] of cellsOf(piece)){
    if (y >= 0) grid[y][x] = piece.color;
  }
  // find full rows
  const full = [];
  for (let y = 0; y < ROWS + HIDDEN; y++){
    if (grid[y].every(c => c !== null)) full.push(y);
  }
  if (full.length){
    flashRows = full;
    flashTimer = 120;
    const pts = [0, 100, 300, 500, 800][full.length] * level;
    score += pts;
    lines += full.length;
    const newLevel = Math.floor(lines / 10) + 1;
    if (newLevel > level) level = newLevel;
    piece = null;
  } else {
    newPiece();
  }
  updateHUD();
}

function clearFlashed(){
  for (const y of flashRows.slice().sort((a,b)=>a-b)){
    grid.splice(y, 1);
    grid.unshift(new Array(COLS).fill(null));
  }
  flashRows = null;
  newPiece();
}

function gravityMs(){
  return Math.max(50, Math.round(1000 * Math.pow(0.8 - (level - 1) * 0.007, level - 1)));
}

function updateHUD(){
  el.score.textContent = score;
  el.lines.textContent = lines;
  el.level.textContent = level;
  if (score > best){ best = score; try{ window.__tetrisBest = best; }catch(e){} }
  el.best.textContent = best;
}

// ---- drawing ----
function drawCell(c, x, y, color, cell, alpha){
  const px = x * cell, py = y * cell;
  c.globalAlpha = alpha === undefined ? 1 : alpha;
  c.fillStyle = color;
  c.fillRect(px + 1, py + 1, cell - 2, cell - 2);
  // top highlight
  c.fillStyle = 'rgba(255,255,255,.22)';
  c.fillRect(px + 1, py + 1, cell - 2, Math.max(2, cell * 0.14));
  // bottom shade
  c.fillStyle = 'rgba(0,0,0,.22)';
  c.fillRect(px + 1, py + cell - Math.max(3, cell * 0.16), cell - 2, Math.max(2, cell * 0.15));
  c.globalAlpha = 1;
}

function drawGrid(){
  ctx.strokeStyle = 'rgba(255,255,255,.045)';
  ctx.lineWidth = 1;
  for (let x = 1; x < COLS; x++){
    ctx.beginPath(); ctx.moveTo(x*CELL+.5, 0); ctx.lineTo(x*CELL+.5, ROWS*CELL); ctx.stroke();
  }
  for (let y = 1; y < ROWS; y++){
    ctx.beginPath(); ctx.moveTo(0, y*CELL+.5); ctx.lineTo(COLS*CELL, y*CELL+.5); ctx.stroke();
  }
}

function render(){
  ctx.clearRect(0, 0, board.width, board.height);
  ctx.fillStyle = '#080a12';
  ctx.fillRect(0, 0, board.width, board.height);
  drawGrid();

  // settled blocks (skip hidden rows)
  for (let y = HIDDEN; y < ROWS + HIDDEN; y++){
    for (let x = 0; x < COLS; x++){
      const c = grid[y][x];
      if (!c) continue;
      const flashing = flashRows && flashRows.indexOf(y) !== -1;
      drawCell(ctx, x, y - HIDDEN, flashing ? '#ffffff' : c, CELL);
    }
  }

  if (piece && (state === 'playing' || state === 'paused')){
    // ghost
    const gy = ghostY();
    if (gy !== piece.y){
      const s = SHAPES[piece.type];
      for (const [x,y] of rotateCells(s.cells, s.size, piece.rot)){
        const py = gy + y - HIDDEN;
        if (py >= 0) drawCell(ctx, piece.x + x, py, piece.color, CELL, 0.18);
      }
    }
    for (const [x,y] of cellsOf(piece)){
      if (y - HIDDEN >= 0) drawCell(ctx, x, y - HIDDEN, piece.color, CELL);
    }
  }
}

// draw a piece centred inside an arbitrary slot rectangle
function drawMini(c, type, sx, sy, sw, sh, cell){
  if (!type) return;
  const s = SHAPES[type];
  const cs = rotateCells(s.cells, s.size, 0);
  const xs = cs.map(p=>p[0]), ys = cs.map(p=>p[1]);
  const minX = Math.min.apply(null,xs), maxX = Math.max.apply(null,xs);
  const minY = Math.min.apply(null,ys), maxY = Math.max.apply(null,ys);
  const w = (maxX - minX + 1) * cell, h = (maxY - minY + 1) * cell;
  const ox = sx + (sw - w) / 2, oy = sy + (sh - h) / 2;
  const lip = Math.max(2, Math.round(cell * 0.15));
  for (const [x,y] of cs){
    const px = ox + (x - minX) * cell, py = oy + (y - minY) * cell;
    c.fillStyle = s.color;
    c.fillRect(px + 1, py + 1, cell - 2, cell - 2);
    c.fillStyle = 'rgba(255,255,255,.22)';
    c.fillRect(px + 1, py + 1, cell - 2, lip);
    c.fillStyle = 'rgba(0,0,0,.22)';
    c.fillRect(px + 1, py + cell - 1 - lip, cell - 2, lip);
  }
}

function renderSide(){
  const L = layout;
  nextCtx.clearRect(0,0,nextCv.width,nextCv.height);
  const n = Math.min(L.nextCount, queue.length);
  for (let i = 0; i < n; i++){
    if (L.vertical) drawMini(nextCtx, queue[i], 0, i * L.slotH, nextCv.width, L.slotH, L.miniCell);
    else drawMini(nextCtx, queue[i], i * L.slotW, 0, L.slotW, nextCv.height, L.miniCell);
  }
  holdCtx.clearRect(0,0,holdCv.width,holdCv.height);
  drawMini(holdCtx, hold, 0, 0, holdCv.width, holdCv.height, L.miniCell);
  if (hold && holdUsed){
    holdCtx.fillStyle = 'rgba(8,10,18,.6)';
    holdCtx.fillRect(0,0,holdCv.width,holdCv.height);
  }
}

// ---- loop ----
function tick(now){
  requestAnimationFrame(tick);
  const dt = Math.min(100, now - (lastTime || now));
  lastTime = now;

  if (state === 'playing'){
    if (flashRows){
      flashTimer -= dt;
      if (flashTimer <= 0) clearFlashed();
    } else if (piece){
      dropTimer += dt;
      if (dropTimer >= gravityMs()){
        dropTimer = 0;
        if (!move(0, 1)){
          if (lockTimer === null) lockTimer = 0;
        }
      }
      // lock delay
      const grounded = collides(Object.assign({}, piece, { y: piece.y + 1 }));
      if (grounded){
        if (lockTimer === null) lockTimer = 0;
        lockTimer += dt;
        if (lockTimer >= 500) lockPiece();
      } else {
        lockTimer = null;
      }
    }
  }
  render();
  renderSide();
}

// ---- state transitions ----
function reset(){
  grid = emptyGrid();
  bag = null; queue = [];
  for (let i = 0; i < 4; i++) queue.push(nextType());
  hold = null; holdUsed = false;
  score = 0; lines = 0; level = 1;
  dropTimer = 0; lockTimer = null; lockResets = 0;
  flashRows = null; flashTimer = 0;
  newPiece();
  updateHUD();
}

function start(){
  reset();
  state = 'playing';
  overlay.classList.remove('show');
}

function pause(){
  if (state !== 'playing') return;
  state = 'paused';
  showOverlay('PAUSED', 'Press P or the button to resume.', 'Resume');
}

function resume(){
  if (state !== 'paused') return;
  state = 'playing';
  overlay.classList.remove('show');
}

function gameOver(){
  state = 'over';
  overAt = performance.now();
  piece = null;
  showOverlay('GAME OVER', 'Score ' + score + ' · ' + lines + ' lines · level ' + level, 'Play again');
}

function showOverlay(title, text, btn){
  ovTitle.textContent = title;
  ovText.textContent = text;
  ovBtn.textContent = btn;
  overlay.classList.add('show');
}

ovBtn.addEventListener('click', function(){
  if (state === 'paused') resume(); else start();
});

// ---- input ----
const held = {};
const DAS = 150, ARR = 40;
let dasTimer = 0, dasDir = 0;

document.addEventListener('keydown', function(e){
  const k = e.key;
  if (['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].indexOf(k) !== -1) e.preventDefault();

  if (k === 'p' || k === 'P'){ state === 'paused' ? resume() : pause(); return; }
  if (k === 'r' || k === 'R'){ start(); return; }
  if (state === 'menu' || state === 'over'){
    // brief lockout so the hard-drop keypress that ended the game
    // doesn't immediately restart it
    if ((k === 'Enter' || k === ' ') && performance.now() - overAt > 700) start();
    return;
  }
  if (state !== 'playing' || !piece) return;
  if (held[k]) return;
  held[k] = true;

  switch(k){
    case 'ArrowLeft':  move(-1,0); dasDir = -1; dasTimer = -DAS; break;
    case 'ArrowRight': move(1,0);  dasDir =  1; dasTimer = -DAS; break;
    case 'ArrowDown':  if (move(0,1)) { score += 1; dropTimer = 0; updateHUD(); } break;
    case 'ArrowUp': case 'x': case 'X': rotate(1); break;
    case 'z': case 'Z': case 'Control': rotate(-1); break;
    case 'c': case 'C': case 'Shift': doHold(); break;
    case ' ': hardDrop(); break;
  }
});

document.addEventListener('keyup', function(e){
  held[e.key] = false;
  if ((e.key === 'ArrowLeft' && dasDir === -1) || (e.key === 'ArrowRight' && dasDir === 1)) dasDir = 0;
});

// auto-repeat for horizontal movement + soft drop
setInterval(function(){
  if (state !== 'playing' || !piece || flashRows) return;
  if (dasDir){
    dasTimer += 16;
    if (dasTimer >= ARR){ dasTimer = 0; move(dasDir, 0); }
  }
  if (held['ArrowDown']){
    if (move(0,1)){ score += 1; dropTimer = 0; updateHUD(); }
  }
}, 16);

// touch buttons
document.querySelectorAll('.touch button').forEach(function(b){
  const act = b.getAttribute('data-act');
  b.addEventListener('click', function(){
    if (state !== 'playing' || !piece) return;
    if (act === 'left') move(-1,0);
    else if (act === 'right') move(1,0);
    else if (act === 'down') { if (move(0,1)) { score += 1; updateHUD(); } }
    else if (act === 'rotate') rotate(1);
    else if (act === 'drop') hardDrop();
  });
});

// swipe controls on the canvas
let tx=0, ty=0, tt=0, moved=false;
board.addEventListener('touchstart', function(e){
  const t = e.changedTouches[0];
  tx = t.clientX; ty = t.clientY; tt = Date.now(); moved = false;
  e.preventDefault();
}, {passive:false});
board.addEventListener('touchmove', function(e){
  if (state !== 'playing' || !piece) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) > 24){ move(dx > 0 ? 1 : -1, 0); tx = t.clientX; moved = true; }
  else if (dy > 28){ move(0,1); ty = t.clientY; moved = true; }
  e.preventDefault();
}, {passive:false});
board.addEventListener('touchend', function(e){
  if (state === 'menu' || state === 'over'){ start(); return; }
  if (state !== 'playing' || !piece) return;
  const t = e.changedTouches[0];
  const dy = t.clientY - ty;
  if (!moved && Date.now() - tt < 250) rotate(1);
  else if (dy > 90) hardDrop();
  e.preventDefault();
}, {passive:false});

// ---- responsive layout ----
function fit(){
  const mobile = window.innerWidth <= 720;

  if (mobile){
    layout = { vertical:false, nextCount:3, miniCell:11, slotW:52, slotH:44 };
    nextCv.width = layout.slotW * layout.nextCount; nextCv.height = layout.slotH;
    holdCv.width = layout.slotW; holdCv.height = layout.slotH;
  } else {
    layout = { vertical:true, nextCount:4, miniCell:20, slotW:126, slotH:72 };
    nextCv.width = layout.slotW; nextCv.height = layout.slotH * layout.nextCount;
    holdCv.width = layout.slotW; holdCv.height = layout.slotH;
  }
  nextCv.style.width = nextCv.width + 'px';
  nextCv.style.height = nextCv.height + 'px';
  holdCv.style.width = holdCv.width + 'px';
  holdCv.style.height = holdCv.height + 'px';

  // scale the whole layout down until it fits the viewport
  const wrap = document.querySelector('.wrap');
  wrap.style.transform = 'none';
  const w = wrap.offsetWidth, h = wrap.offsetHeight;
  const pad = mobile ? 16 : 32;
  const s = Math.min(1, (window.innerWidth - pad) / w, (window.innerHeight - pad) / h);
  wrap.style.transformOrigin = mobile ? 'top center' : 'center center';
  wrap.style.transform = 'scale(' + (Math.round(s * 1000) / 1000) + ')';
}
let layout = { vertical:true, nextCount:4, miniCell:20, slotW:126, slotH:72 };
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function(){ setTimeout(fit, 200); });
fit();

// ---- boot ----
state = 'menu';
reset();
state = 'menu';
showOverlay('TETRIS', 'Arrows to move · Space to drop · C to hold', 'Play');
requestAnimationFrame(tick);

// expose a little surface for testing
window.__tetris = {
  get state(){ return state; },
  get score(){ return score; },
  get lines(){ return lines; },
  get grid(){ return grid; },
  get piece(){ return piece; },
  start: start, hardDrop: hardDrop, move: move, rotate: rotate, hold: doHold,
  setPiece: function(type){ piece = spawn(type); }
};
})();
</script>
